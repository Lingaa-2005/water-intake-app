<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HydroTrack Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>💧 HydroTrack Pro</h1>

  <h2 id="progressText">0 / 3000 ml</h2>

  <!-- Animated Water Circle -->
  <div class="progress-container">
    <div id="progressBar"></div>
    <div class="wave"></div>
  </div>

  <!-- Buttons -->
  <div class="btn-group">
    <button onclick="addWater(250)">+250 ml</button>
    <button onclick="addWater(500)">+500 ml</button>
  </div>

  <!-- Goal -->
  <div class="goal-box">
    <input type="number" id="goalInput" placeholder="Goal (ml)">
    <button onclick="setGoal()">Set</button>
  </div>

  <!-- Streak -->
  <h3 id="streakText">🔥 Streak: 0 days</h3>

  <!-- Achievements -->
  <h4 id="badgeText">🏆 Beginner</h4>

  <!-- Controls -->
  <div class="btn-group">
    <button onclick="resetWater()">Reset</button>
    <button onclick="toggleDark()">🌙</button>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
